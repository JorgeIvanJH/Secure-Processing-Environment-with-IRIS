services:
  iris:
    build: # How is the image built
      context: . # Path to the directory containing the Dockerfile
      dockerfile: Dockerfile # Name of the Dockerfile
    container_name: iris-dataplatform # Name of the container
    ports:
      - "${IRIS_SUPERSERVER_PORT:-1972}:1972"    # SuperServer port
      - "${IRIS_WEB_PORT:-52773}:52773"          # Management Portal/Web Gateway
    environment:
      # Override this with another SQL file to bootstrap a different data source.
      IRIS_SQL_FILE: "${IRIS_SQL_FILE:-/usr/irissys/mgr/sql/bootstrap.sql}"
      # ISC_DATA_DIRECTORY: /dur/iconfig  # Persistent instance data (optional)
    volumes:
      - ./dur/.:/dur:rw # map host directory to container directory with read-write permissions
    restart: always # Always restart the container if it stops (unless explicitly stopped)
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/iris_data_ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    command: --after "/usr/irissys/iris_autoconf.sh" # Run autoconf script after startup
